{% include '_partials/_header.html' %}

<section class="contact">
    <div class="wrapper">
        <h2>On contruit quelque chose qui sort du lot?</h2>

        <div class="contact__grid">
            <div class="window contact__form">
                <div class="window__header">
                    <p>Contactez moi.forms</p>
                </div>
                <div class="window__content">
                    <form class="fields">
                        <div class="field field--prenom">
                            <label for="prenom">Prénom*</label>
                            <input type="text" id="prenom" name="prenom" placeholder="Ex.: Émile" class="cursor-target" required />
                        </div>

                        <div class="field field--nom">
                            <label for="nom">Nom*</label>
                            <input type="text" id="nom" name="nom" placeholder="Ex.: Hébert" class="cursor-target" required />
                        </div>

                        <div class="field field--courriel">
                            <label for="courriel">Courriel*</label>
                            <input type="email" id="courriel" name="courriel" placeholder="Ex.: hebert.emile96@gmail.com" class="cursor-target" required />
                        </div>

                        <div class="field field--telephone">
                            <label for="telephone">Téléphone</label>
                            <input type="tel" id="telephone" name="telephone" placeholder="Ex.: (438)-123-4567" class="cursor-target" />
                        </div>

                        <div class="field field--message">
                            <label for="message">Message*</label>
                            <textarea id="message" name="message" placeholder="Écrivez votre message ici" class="cursor-target" required></textarea>
                        </div>
                    </form>
                </div>
                <div class="window__footer">
                    <p class="small">[Message d'erreur]</p>
                    <a href="#" class="button button--secondary cursor-target" data-component="ScrambledText">Envoyer</a>
                </div>
            </div>

            <div class="contact__side">
                <h4 class="title">Coordonnées</h4>
                <a href="tel:+14385048922" class="cursor-target">(438)-504-8922</a>
                <a href="mailto:hebert.emile96@gmail.com" class="cursor-target">hebert.emile96@gmail.com</a>
                <a href="#" class="cursor-target">Curriculum Vitæ</a>

                <h4 class="title">Réseaux sociaux</h4>
                <div class="list-icons" data-component="IconLabel">
                    <a href="https://github.com/emilehebert" target="_blank" class="logo--link cursor-target" aria-label="GitHub">
                        <svg class="icon icon--lg logo--icon">
                            <use xlink:href="#icon-github"></use>
                        </svg>
                    </a>
                    <a href="https://www.youtube.com/@emile_heb" target="_blank" class="logo--link cursor-target" aria-label="YouTube">
                        <svg class="icon icon--lg logo--icon">
                            <use xlink:href="#icon-youtube"></use>
                        </svg>
                    </a>
                    <a href="https://www.instagram.com/emile_heb/" target="_blank" class="logo--link cursor-target" aria-label="Instagram">
                        <svg class="icon icon--lg logo--icon">
                            <use xlink:href="#icon-instagram"></use>
                        </svg>
                    </a>
                    <a href="https://ca.pinterest.com/hebertemile/" target="_blank" class="logo--link cursor-target" aria-label="Pinterest">
                        <svg class="icon icon--lg logo--icon">
                            <use xlink:href="#icon-pinterest"></use>
                        </svg>
                    </a>
                    <a
                        href="https://www.linkedin.com/in/%C3%A9mile-h%C3%A9bert-9b5849308/"
                        target="_blank"
                        class="logo--link cursor-target"
                        aria-label="LinkedIn"
                    >
                        <svg class="icon icon--lg logo--icon">
                            <use xlink:href="#icon-linkedin"></use>
                        </svg>
                    </a>
                    <a href="https://www.artstation.com/emile-hebert" target="_blank" class="logo--link cursor-target" aria-label="ArtStation">
                        <svg class="icon icon--lg logo--icon">
                            <use xlink:href="#icon-artstation"></use>
                        </svg>
                    </a>
                </div>
                <div class="legal">
                    <p class="small">Tous droits réservés © 2026 Émile Hébert</p>
                    <p class="small"><a href="#" class="cursor-target">[Utilisation de l'IA]</a></p>
                </div>
            </div>
        </div>
    </div>
</section>
